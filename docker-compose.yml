# version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dcrs_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: dcrs
      POSTGRES_PASSWORD: dcrspass
      POSTGRES_DB: dcrs_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcrs -d dcrs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dcrs_qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: dcrs_ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: dcrs_backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://dcrs:dcrspass@postgres:5432/dcrs_db
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REPOS_PATH: /tmp/dcrs_repos
      MAX_FILES: 500
      MAX_LOC: 100000

    volumes:
      - repos_data:/tmp/dcrs_repos

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_started

      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: dcrs_frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000

    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  repos_data: